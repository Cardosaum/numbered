# One-shot: create GitHub releases for 0.1.0 after the first crates.io upload.
# release-plz skips already-published crate versions, so it will not tag them.
# Delete this workflow after the releases exist.
name: Backfill GitHub release

on:
  workflow_dispatch:

jobs:
  backfill:
    name: Create 0.1.0 GitHub releases
    if: ${{ github.repository_owner == 'Cardosaum' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing 0.1.0 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=96cf07fe78b9f50c3d600f55c19da42b708b913f
          notes_from() {
            awk '/^## \[0.1.0\]/{p=1; next} /^## /{p=0} p' "$1"
          }
          create() {
            local tag="$1"
            local notes="$2"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists"
              return
            fi
            # Do not git-push tags: GITHUB_TOKEN cannot push refs that include
            # workflow files. Create the lightweight tag via the API instead.
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" \
                -f sha="${sha}"
            fi
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag
          }
          create numbered-macros-v0.1.0 "$(notes_from macros/CHANGELOG.md)"
          create numbered-v0.1.0 "$(notes_from CHANGELOG.md)"
